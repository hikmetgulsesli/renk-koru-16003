<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Renk Koru - Test Ekranı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#ffdad7",
                    "surface-container-lowest": "#060e20",
                    "on-secondary-container": "#004119",
                    "on-primary-fixed": "#001a42",
                    "inverse-primary": "#005ac2",
                    "secondary-fixed-dim": "#4ae176",
                    "on-primary": "#002e6a",
                    "outline": "#8c909f",
                    "background": "#0b1326",
                    "surface-container-highest": "#2d3449",
                    "on-primary-container": "#00285d",
                    "outline-variant": "#424754",
                    "surface-tint": "#adc6ff",
                    "primary-fixed": "#d8e2ff",
                    "on-secondary-fixed": "#002109",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#2d3449",
                    "surface-container-high": "#222a3d",
                    "secondary-fixed": "#6bff8f",
                    "on-secondary": "#003915",
                    "surface-bright": "#31394d",
                    "tertiary": "#ffb3ad",
                    "on-error": "#690005",
                    "on-tertiary-fixed-variant": "#930013",
                    "tertiary-fixed-dim": "#ffb3ad",
                    "inverse-surface": "#dae2fd",
                    "surface": "#0b1326",
                    "primary-container": "#4d8eff",
                    "on-secondary-fixed-variant": "#005321",
                    "error-container": "#93000a",
                    "secondary": "#4ae176",
                    "surface-dim": "#0b1326",
                    "secondary-container": "#00b954",
                    "on-tertiary-fixed": "#410004",
                    "tertiary-container": "#ff5451",
                    "on-tertiary-container": "#5c0008",
                    "on-background": "#dae2fd",
                    "inverse-on-surface": "#283044",
                    "surface-container": "#171f33",
                    "on-surface-variant": "#c2c6d6",
                    "primary": "#adc6ff",
                    "on-tertiary": "#68000a",
                    "on-primary-fixed-variant": "#004395",
                    "on-surface": "#dae2fd",
                    "error": "#ffb4ab",
                    "surface-container-low": "#131b2e",
                    "primary-fixed-dim": "#adc6ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ishihara-dots {
            background-image: radial-gradient(circle, rgba(173,198,255,0.2) 2px, transparent 3px);
            background-size: 15px 15px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="bg-[#0b1326] dark:bg-[#0b1326] bg-gradient-to-b from-[#131b2e] to-transparent sticky top-0 z-50">
<nav class="flex justify-between items-center w-full px-6 py-4 max-w-screen-xl mx-auto">
<div class="text-2xl font-black text-[#adc6ff] tracking-tight font-headline">Renk Koru</div>
<div class="flex items-center gap-4">
<button class="text-[#adc6ff] hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
</button>
<button class="text-[#adc6ff] hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</nav>
</header>
<!-- Game Content Canvas -->
<main class="flex-1 max-w-screen-xl mx-auto w-full px-6 py-8 flex flex-col gap-10">
<!-- Progress Header -->
<div class="space-y-4">
<div class="flex justify-between items-end">
<div class="space-y-1">
<p class="text-on-surface-variant font-label text-sm tracking-wider">TEST AŞAMASI</p>
<h1 class="text-3xl font-headline font-extrabold text-on-surface">Soru 1/10</h1>
</div>
<div class="text-primary font-headline font-bold text-xl">10%</div>
</div>
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full w-[10%] bg-gradient-to-r from-primary to-primary-container rounded-full transition-all duration-500"></div>
</div>
</div>
<!-- Main Test Layout -->
<div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
<!-- Left: Ishihara Plate Section -->
<div class="lg:col-span-7 flex flex-col items-center gap-8">
<div class="relative group">
<!-- Glass Background for clinical focus -->
<div class="absolute -inset-8 bg-surface-container-low rounded-full blur-3xl opacity-50"></div>
<!-- The Plate -->
<div class="relative w-64 h-64 md:w-80 md:h-80 lg:w-96 lg:h-96 rounded-full bg-surface-container-lowest p-6 shadow-2xl flex items-center justify-center overflow-hidden">
<!-- Ishihara Decorative Image -->
<div class="absolute inset-0 opacity-90 transition-transform duration-700 group-hover:scale-105" data-alt="Close-up of an Ishihara color blindness test plate with varying shades of green and orange dots forming the number 7 clinical sharpness" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuASDXH-ORVOwGiTYH_ouEFCiXYdjWx7-9-UDa5UAxluy3tgtc8BUmp5vaCz06hpuhtl-eR10v0oYCnmRP1q6Z6ERvW7f0lO7Ul6eaCuzQmw2eZ4QopIDjiWco-8GE6klJTJI7aqIwX5i7lu3yaLAuj3t1MoXS_4xhGp6i-KwrbXr_0BOLBcJmTzyYSuC2rl7MwWO7ke6GG7hsC7vR-vEXbEYJeXMin1sfY08gSsc7ePYXmPN-Y6qKl14wvT7ERYQG1kxQAeX1h34B8')">
</div>
<!-- Overlay for clinical feel -->
<div class="absolute inset-0 border-[16px] border-surface-container-lowest rounded-full pointer-events-none"></div>
</div>
</div>
<!-- Status Labels -->
<div class="flex gap-4">
<div class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-high border border-outline-variant/15">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="text-xs font-label font-semibold text-on-surface uppercase tracking-widest">Klinik Doğruluk</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-high border border-outline-variant/15">
<span class="material-symbols-outlined text-primary text-sm" data-icon="visibility" style="font-variation-settings: 'FILL' 1;">visibility</span>
<span class="text-xs font-label font-semibold text-on-surface uppercase tracking-widest">Ishihara Modu</span>
</div>
</div>
</div>
<!-- Right: Input Panel Section -->
<div class="lg:col-span-5 flex flex-col gap-6">
<div class="bg-surface-container-low rounded-[2rem] p-8 shadow-xl">
<div class="mb-8">
<div class="text-center pb-4">
<span class="text-on-surface-variant text-sm font-label uppercase tracking-widest">Cevabınızı Girin</span>
</div>
<!-- Answer Display -->
<div class="h-24 bg-surface-container-highest rounded-2xl flex items-center justify-center border-b-2 border-primary">
<span class="text-5xl font-headline font-black text-on-primary-fixed tracking-tighter">—</span>
</div>
</div>
<!-- Numeric Keyboard Bento -->
<div class="grid grid-cols-3 gap-3">
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">1</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">2</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">3</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">4</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">5</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">6</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">7</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">8</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">9</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">Göremiyorum</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest hover:bg-surface-bright text-on-surface text-2xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">0</button>
<button class="h-16 flex items-center justify-center bg-surface-container-highest/50 hover:bg-error-container/20 text-error text-xl font-headline font-bold rounded-2xl transition-all active:scale-95 duration-200">Sil</button>
</div>
<!-- Action Buttons -->
<div class="mt-8">
<button class="w-full h-16 bg-gradient-to-br from-[#adc6ff] to-[#4d8eff] text-[#002e6a] font-headline font-extrabold text-xl rounded-2xl shadow-lg shadow-primary/10 transition-all hover:opacity-90 active:scale-[0.96] duration-300">
                            Gönder
                        </button>
</div>
</div>
<div class="px-4 text-center">
<p class="text-on-surface-variant text-xs leading-relaxed opacity-60">
                        En iyi sonuçlar için ekran parlaklığınızın %50'nin üzerinde olduğundan ve gece modunun kapalı olduğundan emin olun.
                    </p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Suppressed for Task-Focused Screen (Test) -->
<!-- As per Shell Visibility & Relevance: Hide nav shell on Task-Focused Screens -->
</body></html>
