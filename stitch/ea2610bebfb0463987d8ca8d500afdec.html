<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Renk Koru - Geçmiş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#ffdad7",
                    "surface-container-lowest": "#060e20",
                    "on-secondary-container": "#004119",
                    "on-primary-fixed": "#001a42",
                    "inverse-primary": "#005ac2",
                    "secondary-fixed-dim": "#4ae176",
                    "on-primary": "#002e6a",
                    "outline": "#8c909f",
                    "background": "#0b1326",
                    "surface-container-highest": "#2d3449",
                    "on-primary-container": "#00285d",
                    "outline-variant": "#424754",
                    "surface-tint": "#adc6ff",
                    "primary-fixed": "#d8e2ff",
                    "on-secondary-fixed": "#002109",
                    "on-error-container": "#ffdad6",
                    "surface-variant": "#2d3449",
                    "surface-container-high": "#222a3d",
                    "secondary-fixed": "#6bff8f",
                    "on-secondary": "#003915",
                    "surface-bright": "#31394d",
                    "tertiary": "#ffb3ad",
                    "on-error": "#690005",
                    "on-tertiary-fixed-variant": "#930013",
                    "tertiary-fixed-dim": "#ffb3ad",
                    "inverse-surface": "#dae2fd",
                    "surface": "#0b1326",
                    "primary-container": "#4d8eff",
                    "on-secondary-fixed-variant": "#005321",
                    "error-container": "#93000a",
                    "secondary": "#4ae176",
                    "surface-dim": "#0b1326",
                    "secondary-container": "#00b954",
                    "on-tertiary-fixed": "#410004",
                    "tertiary-container": "#ff5451",
                    "on-tertiary-container": "#5c0008",
                    "on-background": "#dae2fd",
                    "inverse-on-surface": "#283044",
                    "surface-container": "#171f33",
                    "on-surface-variant": "#c2c6d6",
                    "primary": "#adc6ff",
                    "on-tertiary": "#68000a",
                    "on-primary-fixed-variant": "#004395",
                    "on-surface": "#dae2fd",
                    "error": "#ffb4ab",
                    "surface-container-low": "#131b2e",
                    "primary-fixed-dim": "#adc6ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
    </style>
</head>
<body class="font-body selection:bg-primary/30 antialiased overflow-hidden">
<!-- TopNavBar -->
<header class="bg-[#0b1326] dark:bg-[#0b1326] bg-gradient-to-b from-[#131b2e] to-transparent fixed top-0 left-0 right-0 z-50">
<nav class="flex justify-between items-center w-full px-6 py-4 max-w-screen-xl mx-auto">
<div class="text-2xl font-black text-[#adc6ff] tracking-tight font-headline">Renk Koru</div>
<div class="flex items-center gap-4">
<button class="text-[#adc6ff] hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
</button>
<button class="text-[#adc6ff] hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</nav>
</header>
<!-- Main Canvas -->
<main class="relative min-h-screen flex items-center justify-center px-6 pt-20 pb-32 overflow-hidden">
<!-- Background Ambient Accents -->
<div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Empty State Container -->
<div class="max-w-md w-full flex flex-col items-center text-center space-y-8">
<!-- Visual Graphic Anchor (Clinical/Editorial Style) -->
<div class="relative group">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-2xl group-hover:bg-primary/30 transition-all duration-500"></div>
<div class="relative w-48 h-48 bg-surface-container-low rounded-full flex items-center justify-center border border-outline-variant/15">
<!-- Glassmorphism Ring -->
<div class="absolute inset-4 rounded-full border border-outline-variant/10 backdrop-blur-sm"></div>
<span class="material-symbols-outlined text-8xl text-outline-variant/40" data-icon="history" style="font-variation-settings: 'wght' 200;">history</span>
<!-- Floating Data Points Decoration -->
<div class="absolute top-4 right-4 w-3 h-3 bg-secondary/40 rounded-full"></div>
<div class="absolute bottom-8 left-4 w-2 h-2 bg-primary/40 rounded-full"></div>
</div>
</div>
<!-- Content -->
<div class="space-y-4">
<h1 class="font-headline text-3xl font-extrabold text-on-surface tracking-tight">
                    Henüz bir test yapmadın.
                </h1>
<p class="font-body text-on-surface-variant leading-relaxed text-lg opacity-80">
                    Renk görüşünü profesyonel klinik standartlarda test etmek ve sonuçlarını kaydetmek için hemen başla!
                </p>
</div>
<!-- Primary CTA -->
<div class="w-full pt-4">
<button class="group relative w-full h-[64px] rounded-xl overflow-hidden transition-all duration-300 active:scale-95 shadow-2xl">
<div class="absolute inset-0 bg-gradient-to-br from-[#adc6ff] to-[#4d8eff]"></div>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="relative font-headline font-bold text-[#0b1326] text-lg flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="play_circle" style="font-variation-settings: 'FILL' 1;">play_circle</span>
                        İlk Testine Başla
                    </span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#131b2e]/80 backdrop-blur-xl border-t border-[#424754]/15 shadow-[0_-10px_40px_rgba(218,226,253,0.06)] rounded-t-[2rem]">
<!-- Tab: Test -->
<a class="flex flex-col items-center justify-center text-[#dae2fd] opacity-60 px-5 py-2 hover:bg-[#222a3d] rounded-2xl transition-all font-['Inter'] text-[10px] font-medium tracking-wide" href="#">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="visibility">visibility</span>
            Test
        </a>
<!-- Tab: Geçmiş (Active State) -->
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#adc6ff] to-[#4d8eff] text-[#0b1326] rounded-2xl px-5 py-2 Active: scale-95 duration-300 ease-in-out font-['Inter'] text-[10px] font-medium tracking-wide" href="#">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="history" style="font-variation-settings: 'FILL' 1;">history</span>
            Geçmiş
        </a>
<!-- Tab: Bilgi -->
<a class="flex flex-col items-center justify-center text-[#dae2fd] opacity-60 px-5 py-2 hover:bg-[#222a3d] rounded-2xl transition-all font-['Inter'] text-[10px] font-medium tracking-wide" href="#">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="info">info</span>
            Bilgi
        </a>
</nav>
</body></html>
